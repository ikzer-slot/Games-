 const isAI=owner>=0;
 const shirt=isAI?AIS[owner].c:'#7a5a3a';
 const g=makePerson(shirt,null,['#3a2a1a','#5a3a1e','#222','#8a6a3a'][(idx+(isAI?owner:0))%4],{apron:false,hat:isAI&&idx%2?'#5a4a3a':null,pants:'#4a3a2a'});
 const src=isAI?FURN.rivals[owner]:null;
 const sx=isAI?src.door.x:DORM_DOOR.x,sz=isAI?src.door.z+.6:DORM_DOOR.z;
 g.position.set(sx,0,sz);scene3.add(g);
 const bundle=makeBundle();g.add(bundle);
 const tag=document.createElement('div');tag.className='tag3 wtag';
 const col=isAI?(owner===0?'#ff9a8a':owner===1?'#ffb070':'#8ad0ff'):'#ffe8b0';
 tag.innerHTML=`<b style="color:${col}"></b><span></span>`;$('#tags').appendChild(tag);
 const w={uid:WKU++,owner,a,idx,g,bundle,tag,tn:tag.firstChild,tsp:tag.lastChild,tsig:'',st:'out',t:0,node:null,sx:0,sz:0,hit:0,inv:0,bag:{},cap:10,act:'',lx:sx,lz:sz,stk:0,det:0,detDir:1,stuckT:0,toolSig:'',toolG:null,lt:null,cid:'w'+WKU,inside:false,name:isAI?APP_NAMES[(idx*3+owner*4+2)%APP_NAMES.length]:a.n,lvl:0,msg:''};
 if(!isAI){const gh=ghost(.8,1.9,.8,0,.95,0,g);reg(g,'apprentice',{a})}
 WK.push(w);return w}
function wkRemove(w){
 if(w.node)w.node.claim=undefined;
 scene3.remove(w.g);unreg(w.g);w.tag.remove();
 const i=WK.indexOf(w);if(i>=0)WK.splice(i,1)}
function wkReset(){
 while(WK.length)wkRemove(WK[0]);
 DEP.sig='';depUpdate()}
function wkSync(){
 // ouvriers du joueur <-> S.apps
 for(const w of WK.slice())if(w.owner<0&&!S.apps.includes(w.a))wkRemove(w);
 S.apps.forEach((a,i)=>{if(!WK.some(w=>w.a===a))wkCreate(-1,a,i)});
 // ouvriers rivaux <-> a.helpers
 for(let i=0;i<3;i++){
  const mine=WK.filter(w=>w.owner===i);
  while(mine.length>S.ai[i].helpers){wkRemove(mine.pop())}
  for(let k=mine.length;k<S.ai[i].helpers;k++){const w=wkCreate(i,S.ai[i],k);mine.push(w);w.inside=false}}}

/* ---------- ce que chaque ouvrier sait faire ---------- */
function wkCtx(w){
 const night=S.t>=DAY_LEN*.94;
 if(w.owner<0){
  const a=w.a;w.lvl=a.lvl;
  const T=APP_TASKS[a.task];
  const gather=wkGather(a.task);
  const tl=appTool(a),pt=tl?tl.tier:-1;           // l'outil prêté depuis l'entrepôt des ouvriers
  const tt=Math.max(0,pt);
  let blocked=null;
  if(gather){
   if(!tl||tl.type!==(a.task==='bois'?'hache':'pioche'))blocked=a.task==='bois'?'Il lui faut une hache (entrepôt des ouvriers).':'Il lui faut une pioche (entrepôt des ouvriers).';
   else if(a.task!=='bois'&&T.tool!==undefined&&pt<T.tool)blocked=`Il lui faut une pioche en ${TIERS[T.tool].n.toLowerCase()}.`}
  const pace=1+.12*a.lvl;
  return {night,gather,blocked,pred:gather?wkKind(a.task):null,access:a.task==='bois'?9:pt,tt,pace,
   cap:Math.min(28,(a.task==='bois'?14:9)+2*a.lvl),sp:3.9+.2*a.lvl,
   dmg:(1+.8*tt)*(1+.08*a.lvl)*1.4,hitI:1/pace,
   drop:{x:DEP.x+2.35,z:DEP.z+((w.idx%3)-1)*.75},face:DEP,
   home:DORM_HOME,tool:a.task==='bois'?'hache':'pioche',toolTier:tt}}
 const a=S.ai[w.owner],A=AIS[w.owner],R0=FURN.rivals[w.owner];
 const want=rvWants(a),pace=rvPace(w.owner);
 w.lvl=Math.floor(a.tier/2);
 w.dropP=w.dropP||wkFreeSpot(R0.ax,R0.az+.2,w.idx);
 return {night,gather:true,blocked:null,pred:want,access:9,tt:rvToolTier(a),pace,idleAll:rvIdle(a),
  cap:9,sp:3.6*Math.min(1.25,.85+pace*.3),
  dmg:(1+.8*rvToolTier(a))*(.8+A.skill*.4)*1.25,hitI:1/pace,
  drop:w.dropP,face:{x:R0.ax,z:R0.az},home:R0.home,tool:a.tier===0?'hache':(a.tier===1||a.tier>=2)?'pioche':'pioche',toolTier:rvToolTier(a)}}
function wkFreeSpot(x,z,idx){
 const ring=[[1.7,.6],[1.4,1.6],[-1.5,1.0],[2.2,-.4],[-2.0,-.4],[.6,2.2],[-.8,2.4],[2.4,1.8]];
 for(let k=0;k<ring.length;k++){const c=ring[(k+idx)%ring.length];if(!blocked(x+c[0],z+c[1],.4))return {x:x+c[0],z:z+c[1]}}
 return {x,z}}
function wkYield(w,n){
 if(w.owner>=0){const a=S.ai[w.owner];return {u:rvYield(n,a)}}
 const a=w.a,tl=appTool(a),tt=Math.max(0,tl?tl.tier:0);
 if(n.kind==='tree')return {bois:RI(3,5)+Math.floor(tt*1.2)+Math.floor(a.lvl/3)};
 if(a.task==='gemmes'){
  if(Math.random()<.5){const g=tt>=3&&Math.random()<.07?'diamant':pick(['rubis','saphir','emeraude']);const o={};o['gem_'+g]=1;return o}
  return {}}
 const sp=SPOTS.find(s=>s.id===n.spot)||SPOTS[1];
 const q=Math.max(1,Math.round(RI(sp.qty[0],sp.qty[1])*(1+.3*tt)))+Math.floor(a.lvl/3);
 const o={};o[n.res]=q;return o}
function wkPickNode(w,c){
 let best=null,bs=1e9;const x=w.g.position.x,z=w.g.position.z;
 for(const n of nodes){
  if(!n.alive||n.gr<.95||!c.pred(n)||n.min>c.access)continue;
  if(n.claim!==undefined&&n.claim!==w.cid)continue;
  const d=Math.hypot(n.x-x,n.z-z)+Math.random()*6;
  if(d<bs){bs=d;best=n}}
 return best}
function wkDeposit(w,c){
 const got=[];
 if(w.owner>=0){const a=S.ai[w.owner];a.units=(a.units||0)+(w.bag.u||0);a.gath=(a.gath||0)+(w.bag.u||0);touch()}
 else{
  for(const k in w.bag){const q=w.bag[k];give(k,q);if(!k.startsWith('gem_'))S.tot.gathered+=q;got.push(`+${q} ${RES[k].n}`)}
  const near=Math.hypot(w.g.position.x-P.x,w.g.position.z-P.z)<24;
  if(got.length&&near)toast(`${w.name} dépose : ${got.join('  ')}`);
  touch()}
 w.bag={};w.inv=0}
function wkAddBag(w,got){
 for(const k in got){w.bag[k]=(w.bag[k]||0)+got[k];w.inv+=got[k]}}
function wkXp(w){
 if(w.owner>=0)return;
 const a=w.a;a.xp++;
 if(a.xp>=4+a.lvl*3&&a.lvl<8){a.lvl++;a.xp=0;toast(`${a.n} progresse : niveau ${a.lvl+1} !`,'good');touch()}}
function wkSfx(k,dist){if(dist>24)return;SFXV=clamp(1-dist/24,.04,1)*.5;sfx(k);SFXV=1}

/* ---------- la boucle d'un ouvrier ---------- */
function wkStep(w,c,dt){
 const g=w.g,pos=g.position,a=w.a;
 let moving=false,work=false,tool='';
 const isAI=w.owner>=0;w.cap=c.cap;
 const dist=Math.hypot(pos.x-P.x,pos.z-P.z);
 // dehors / dedans (nuit)
 if(c.night&&w.st!=='home'&&w.st!=='in'&&w.st!=='toDrop'&&w.st!=='drop'){
  if(w.node){w.node.claim=undefined;w.node=null}
  w.st=w.inv>0?'toDrop':'home'}
 if(w.st==='out'){ // sort au petit matin
  if(c.night){w.st='in';g.visible=false;w.inside=true}
  else{g.visible=true;w.inside=false;w.st='idle';w.t=0}}
 if(w.st==='in'){
  if(!c.night){const dst=isAI?FURN.rivals[w.owner].door:DORM_DOOR;pos.set(dst.x,0,dst.z+(isAI?.6:0));g.visible=true;w.inside=false;w.st='idle'}
  else{g.visible=false;return}}
 // tâche changée
 if(!isAI){
  if(w.lt!==a.task){w.lt=a.task;if(w.node){w.node.claim=undefined;w.node=null}
   if(w.inv>0&&w.st!=='home')w.st='toDrop';else if(w.st!=='home')w.st='idle';w.msg=''}
  a.msg=w.msg}
 w.act='';
 switch(w.st){
  case 'home':{
   const h=c.home;moving=rvWalk(w,h.x,h.z,c.sp,dt);w.act='rentre';
   if(!moving){w.st='in';g.visible=false;w.inside=true}
   break}
  case 'idle':{
   if(!isAI&&!c.gather){w.st='static';break}
   if(c.blocked){w.msg=c.blocked;w.act=/entrepôt/.test(c.blocked)?'attend un outil':'attend une meilleure pioche';
    moving=rvWalk(w,c.drop.x,c.drop.z,c.sp,dt);break}
   w.msg='';
   if(w.inv>=c.cap-2){w.st='toDrop';break}
   if(c.idleAll&&w.inv===0){w.act='se repose';break}
   const n=wkPickNode(w,c);
   if(n){w.node=n;n.claim=w.cid;const sp=rvStand(n,w);w.sx=sp.x;w.sz=sp.z;w.st='toNode';w.stuckT=0;
    w.act=n.kind==='tree'?'vers la forêt':n.kind==='rock'?'vers la carrière':'vers la mine'}
   else if(w.inv>0)w.st='toDrop';
   else{w.st='wait';w.t=rnd(1.2,2.5);w.act='cherche un coin libre'}
   break}
  case 'wait':w.act='cherche un coin libre';w.t-=dt;if(w.t<=0)w.st='idle';break;
  case 'toNode':{
   const n=w.node;
   if(!n||!n.alive||(n.claim!==w.cid)){w.node=null;w.st='idle';break}
   moving=rvWalk(w,w.sx,w.sz,c.sp,dt);
   w.act=n.kind==='tree'?'file abattre un arbre':'file casser de la pierre';
   if(!moving){w.st='hit';w.hit=.25}
   break}
  case 'hit':{
   const n=w.node;
   if(!n||!n.alive){w.node=null;w.st='idle';break}
   rvFace(w,n.x,n.z,dt);work=true;tool=n.kind==='tree'?'hache':'pioche';
   w.act=n.kind==='tree'?'abat un arbre':n.kind==='rock'?'brise de la pierre':'extrait du minerai';
   w.hit-=dt;
   if(w.hit<=0){
    w.hit=c.hitI*R2(.9,1.1);
    n.hp-=c.dmg;n.shk=.25;
    wkSfx(n.kind==='tree'?'chop':'stone',dist);
    if(dist<40){const p=new THREE.Vector3(n.x+(pos.x-n.x)*.3,n.kind==='tree'?1.5:(n.sz||1)*.8,n.z+(pos.z-n.z)*.3);burst(p,5,n.kind==='tree'?'#b08850':(n.kind==='ore'?RES[n.res].c:'#aaa'),2.4)}
    if(n.hp<=0){
     killNode(n,pos.x,pos.z);wkSfx('thud',dist);
     wkAddBag(w,wkYield(w,n));wkXp(w);
     w.node=null;w.st='pause';w.t=.35}}
   break}
  case 'pause':w.act='ramasse';w.t-=dt;if(w.t<=0)w.st='idle';break;
  case 'toDrop':{
   moving=rvWalk(w,c.drop.x,c.drop.z,c.sp*(w.inv>c.cap*.6?.92:1),dt);w.act=`rapporte ${w.inv} à la forge`;
   if(!moving){w.st='drop';w.t=.7}
   break}
  case 'drop':{
   w.act='dépose son chargement';rvFace(w,c.face.x,c.face.z,dt);w.t-=dt;
   if(w.t<=0||w.inv===0){
    if(w.inv>0){wkDeposit(w,c);wkSfx('thud',dist)}
    w.st=c.night?'home':'idle';w.t=0}
   break}
  case 'static':{ // fondre / forger / vendre : placé au bon poste
   const sp=appSpot(a,S.apps.indexOf(a));
   if(c.gather){w.st='idle';break}
   moving=stepToward(g,sp.x,sp.z,3.6,dt);
   if(!moving){g.rotation.y+=(Math.PI-g.rotation.y)*Math.min(1,dt*4);work=a.task!=='vendre'&&!a.msg;w.act=a.task==='vendre'?'tient l’étal':a.task==='forge'?'forge':'fond'}
   else w.act='rejoint son poste';
   if(a.task==='forge'||a.task==='fondre')tool='marteau';
   break}}
 wkTool(w,tool,tool==='marteau'?1:c.toolTier);
 animPerson(g,dt,moving,work);
 wkBundle(w)}

 if(WKT<=0){WKT=1.2;wkSync()}
 for(const w of WK){
  if(w.inside&&!(S.t<DAY_LEN*.94)){continue}
  const c=wkCtx(w);wkStep(w,c,dt)}

    const sig=nm+'|'+t;if(w.tsig!==sig){w.tsig=sig;w.tn.textContent=nm;w.tsp.textContent=t}}}

  const dx=z.g.position.x-P.x,dz=z.g.position.z-P.z,d=Math.hypot(dx,dz),rad=.45*z.Z.sc*(z.Z.wx+z.Z.wz)/2;

function zUpdate(z,dt){
 const g=z.g,Z=z.Z,px=P.x,pz=P.z;
 z.ph+=dt*(z.k==='runner'?9:z.k==='walker'?4.2:z.k==='brute'?3:2.4)*(z.st==='chase'?1:.3);

 // recul

 if(z.st==='rise'){
  z.t+=dt;const u=Math.min(1,z.t/1.5),e=1-Math.pow(1-u,3);g.position.y=-2.6*(1-e);
  const ta=Math.atan2(ARN.x-g.position.x,ARN.z-g.position.z);g.rotation.y+=0;
  arms(-2.4,-2.2,6);z.body.rotation.x=.1;

  return}
 if(z.st==='die'){
  z.dieT+=dt;const u=Math.min(1,z.dieT/.6);z.rig.rotation.x=-1.5*(u*u);z.rig.position.y=z.dieT>1.4?-(z.dieT-1.4)*.5:0;
  z.rig.position.z=-.2*u*z.Z.sc;if(z.aL){arms(-.4,-.3,10)}return}

  turn();
  if(d>Z.reach*.82){const s=z.sp*dt;g.position.x+=dx/d*s;g.position.z+=dz/d*s;legs(z.k==='runner'?.9:.6)}
  else{legs(0);z.cd-=dt;if(z.cd<=0){z.st='wind';z.t=0;z.didHit=false;if(Z.slam)ARENA.warn=Math.max(ARENA.warn,.6)}}
  z.body.rotation.x=lean+Math.sin(z.ph*.5)*.05;
  if(z.k==='runner')arms(-.9+Math.sin(z.ph)*.5,-.9-Math.sin(z.ph)*.5,10);else arms(-1.35+Math.sin(z.ph*.7)*.1,-1.25-Math.sin(z.ph*.6)*.1,6);
  if(z.head){z.head.rotation.z=Math.sin(z.ph*.6)*.16;z.head.rotation.x=Math.sin(z.ph*.4)*.08}if(z.jaw)z.jaw.rotation.x=.15+Math.abs(Math.sin(z.ph*.5))*.25;
  g.position.y=Math.abs(Math.sin(z.ph))*.03*(z.k==='runner'?1.5:1);
  // reste dans l'arène
  const rx=g.position.x-ARN.x,rz=g.position.z-ARN.z,rr=Math.hypot(rx,rz),mx=ARN.R-1.3;if(rr>mx){g.position.x=ARN.x+rx/rr*mx;g.position.z=ARN.z+rz/rr*mx}
  return}
 if(z.st==='wind'){
  z.t+=dt;turn();const u=Math.min(1,z.t/Z.wind);arms(-2.7,-2.7,9);z.body.rotation.x=lean-.25*u;legs(0);if(z.jaw)z.jaw.rotation.x=.5;
  if(z.t>=Z.wind){
   z.st='hit';z.t=0;arms(-.3,-.3,30);z.body.rotation.x=lean+.35;
   if(Z.slam){ // coup de masse : dégâts de zone devant lui
    const cx=g.position.x+Math.sin(g.rotation.y)*Z.reach*.7,cz=g.position.z+Math.cos(g.rotation.y)*Z.reach*.7;

  return}
 if(z.st==='hit'){z.t+=dt;if(z.t>=Z.rec){z.st='chase';z.t=0;z.cd=.2+Math.random()*.4}return}
}

const ACH=[
 ['forge1','Premier coup de marteau','Forger un objet.',()=>S.tot.forged>=1,40],
 ['forge10','Main sûre','Forger 10 objets.',()=>S.tot.forged>=10,100],
 ['forge40','Maître forgeron','Forger 40 objets.',()=>S.tot.forged>=40,300],
 ['vente10','Étal bien garni','Vendre 10 objets.',()=>S.tot.sold>=10,120],
 ['riche500','Bourse bien remplie','Avoir 500 pièces.',()=>S.gold>=500,100],
 ['riche5000','Fortune de marchand','Avoir 5 000 pièces.',()=>S.gold>=5000,600],
 ['equipe3','Maître d’atelier','Employer 3 apprentis.',()=>S.hired>=3,150],
 ['cmd5','Fournisseur du village','Livrer 5 commandes.',()=>S.tot.delivered>=5,200],
 ['tier3','Métal noble','Posséder un objet de tier 4.',()=>S.items.some(i=>i.tier>=3),250],
 ['tier5','Orichalque !','Posséder un objet de tier 6.',()=>S.items.some(i=>i.tier>=5),800],
 ['arene5','Fossoyeur terrassé','Vaincre le boss de la vague 5.',()=>AS().best>=5,250],
 ['arene10','Champion de l’arène','Terminer la vague 10.',()=>AS().best>=10,500],
 ['arene20','Légende vivante','Terminer la vague 20.',()=>AS().best>=20,1500],
 ['kills100','Faucheur','Abattre 100 morts-vivants.',()=>AS().kills>=100,300],
 ['voleur','Main de fer','Rattraper un voleur.',()=>FS().caught>=1,120],
 ['marchand','Bonne affaire','Acheter chez le marchand ambulant.',()=>FS().buys>=1,80],
 ['foudre','Sous l’orage','Voir la foudre frapper un arbre.',()=>FS().strikes>=1,60]];
function frAchCheck(){
 const f=FS();
 for(const a of ACH){if(f.ach[a[0]])continue;let ok=false;try{ok=a[3]()}catch(e){}
  if(ok){f.ach[a[0]]=S.day||1;S.gold+=a[4];toast(`🏆 Succès : ${a[1]} (+${a[4]} po)`,'gold');sfx('magic');touch()}}}
function renderSucces(){
 const f=FS(),done=ACH.filter(a=>f.ach[a[0]]).length;
 return `<div class="sec">Succès <small>${done}/${ACH.length}</small></div>`+ACH.map(a=>{const ok=!!f.ach[a[0]];
  return `<div class="card row" style="${ok?'':'opacity:.55'}"><div style="font-size:22px;width:30px;text-align:center">${ok?'🏆':'🔒'}</div><div class="grow"><b>${a[1]}</b><div class="small dim">${a[2]}</div></div><div class="small ${ok?'':'dim'}">${ok?'jour '+f.ach[a[0]]:'+'+a[4]+' po'}</div></div>`}).join('')}

/* ---------- boucle ---------- */
function frUpdate(dt,running){
 if(!S)return;
 if(FR.day!==S.day)frNewDay();
 FR.achT-=dt;if(FR.achT<=0){FR.achT=2;frAchCheck()}
 if(!running)return;
 // déclenche l'événement prévu
 const p=S.t/DAY_LEN;
 if(FR.plan&&p>=FR.plan.at&&!ARENA.run&&!FR.merch&&!FR.thief&&p<.8){const ty=FR.plan.type;FR.plan=null;if(ty==='merch')frStartMerch();else frStartThief()}
 frMerchUpdate(dt);frThiefUpdate(dt);
 if(ARENA.run)frPkUpdate(dt)}

/* ===== Les Quatre Enclumes (3D) — démarrage ===== */
function syncBuild(){}
function resetWorldCaches(){if(typeof wkReset==='function'&&DEP.g)wkReset();rackSigs='#';vitSig='#';appSig='#';sceneFx('off');if(typeof arenaCancel==='function')arenaCancel(true);if(FG)endForge();curTarget=null}
function newGame(){
 S=newState();custs=[];curH=null;resetWorldCaches();
 startDay();
 openModal(introHTML());
 touch()}
function continueGame(){
 const s=loadSave();
 if(!s){newGame();return}
 S=s;S.paused=false;custs=[];curH=null;S.items.forEach(i=>i.reserved=0);
 if(S.cfg&&S.cfg.dayLen)DAY_LEN=S.cfg.dayLen;
 if(S.t>=DAY_LEN)S.t=DAY_LEN*.5;
 resetWorldCaches();
 P.x=0;P.z=-7.4;P.yaw=Math.PI;P.pitch=-.05;
 touch()}

let lastT=performance.now(),autosave=0;
function loop(now){
 const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
 requestAnimationFrame(loop);
 if(!S||!renderer)return;
 const running=!S.paused&&!modalOpen();
 try{
  if(running)step(dt);
  if(dirty){dirty=false;if(panel&&modal)refreshPanel()}
  worldUpdate(dt,running);
  updateHud();
  const lh=$('#lockhint');if(!isTouch){lh.style.display=(!modal&&!FG&&document.pointerLockElement!==$('#gl')&&!lockState.drag)?'block':'none'}
  renderFrame();
 }catch(e){console.error(e);window.__err=(window.__err||0)+1;if(window.__err<5)toast('Erreur : '+e.message,'bad')}
 autosave+=dt;if(autosave>20){autosave=0;save()}}

function boot(){
 if(isTouch)document.body.classList.add('touch');
 $('#goldic').innerHTML=resIcon('gold',16);
 initWorld();
 const sv=loadSave();
 if(sv){
  S=sv;if(S.cfg&&S.cfg.dayLen)DAY_LEN=S.cfg.dayLen;
  S.paused=true;resetWorldCaches();
  openModal(`<h2>Les Quatre Enclumes</h2><p style="text-align:center">Une partie est en cours : jour ${sv.day}, ${fmt(sv.gold)} pièces d’or.</p><div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn primary big" data-act="cont">Continuer</button><button class="btn" data-act="newg">Nouvelle partie</button></div>`,{locked:true})}
 else newGame();
 requestAnimationFrame(loop)}


boot();
</script></body></html>
