<style>
/* Layout: one-column gym logbook, sticky header, fixed bottom tab bar; bumper-plate colours code the data. */
:root {
  --bg: #eceff3; --surface: #ffffff; --surface-2: #f5f7fa; --ink: #12161d; --muted: #5a6371; --line: #d3d9e1;
  --accent: #c8202f; --accent-ink: #ffffff; --accent-soft: #fbe3e5;
  --up: #17864a; --up-soft: #dcf2e5; --hold: #1d5bb8; --hold-soft: #e0eafa; --down: #a86200; --down-soft: #fbecd4;
  --fig: #c4cbd5; --p25: #d22b3a; --p20: #2160c4; --p15: #e2ab00; --p10: #1f9a52; --p5: #e9edf2; --p125: #9aa3ae;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1115; --surface: #171b21; --surface-2: #1d222a; --ink: #e9ecf1; --muted: #8e97a5; --line: #2a313b;
  --accent: #ff4a5b; --accent-ink: #1a0005; --accent-soft: #3a161b;
  --up: #4cd08a; --up-soft: #12301f; --hold: #6aa2ff; --hold-soft: #15243d; --down: #f0a940; --down-soft: #33240e;
  --p5: #c9ced6; --fig: #3a424e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1115; --surface: #171b21; --surface-2: #1d222a; --ink: #e9ecf1; --muted: #8e97a5; --line: #2a313b;
  --accent: #ff4a5b; --accent-ink: #1a0005; --accent-soft: #3a161b;
  --up: #4cd08a; --up-soft: #12301f; --hold: #6aa2ff; --hold-soft: #15243d; --down: #f0a940; --down-soft: #33240e;
  --p5: #c9ced6; --fig: #3a424e; color-scheme: dark; }

html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hold); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.cloud i { background: var(--up); }

main { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
main.resting { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }

.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: default; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.field { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-height: 44px; font-weight: 500; width: 100%; box-sizing: border-box; }

/* Start screen */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.hero-band { display: flex; height: 8px; }
.hero-band span { flex: 1; }
.hero-in { padding: 18px 16px 16px; display: grid; gap: 12px; }
.hero h2 { font-size: 44px; font-weight: 800; text-transform: uppercase; }
.plan { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.plan li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.plan li b { font-weight: 600; }
.plan li .num { color: var(--muted); font-size: 14px; white-space: nowrap; }
.tpl { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tpl button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.tpl button:hover { border-color: var(--ink); }
.tpl b { font-family: var(--display); font-size: 22px; text-transform: uppercase; }
.tpl span { font-size: 13px; color: var(--muted); }

/* Active workout */
.wk-head { position: relative; }
.wk-name { font-family: var(--display); font-size: 30px; font-weight: 800; text-transform: uppercase; border: 0; background: transparent; width: 100%; padding: 0; min-width: 0; }
.wk-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.wk-meta b { color: var(--ink); }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; display: grid; gap: 10px; min-width: 0; }
.ex-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.ex-h h3 { font-size: 24px; }
.ex-h .chip { margin-top: 4px; }
.ex-id { display: flex; gap: 12px; align-items: center; min-width: 0; }
.ex-id > div { min-width: 0; display: grid; gap: 4px; justify-items: start; }
.ex-id .chip { margin-top: 0; }
.chip.sec { background: transparent; }
.mfig { flex: none; width: 84px; height: 84px; background: var(--surface-2); border-radius: 8px; padding: 3px; box-sizing: border-box; }
.mfig .n { fill: var(--line); }
.mfig .m { fill: var(--fig); stroke: var(--surface-2); stroke-width: .6; }
.mfig .m.on { fill: var(--accent); }
.mfig .m.sec { fill: color-mix(in srgb, var(--accent) 30%, var(--fig)); }
.chip.main { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.advice { border-radius: 8px; padding: 10px 12px; font-size: 14px; display: grid; gap: 2px; }
.advice b { font-family: var(--mono); font-size: 15px; }
.k-up { background: var(--up-soft); } .k-up .tag { color: var(--up); }
.k-hold { background: var(--hold-soft); } .k-hold .tag { color: var(--hold); }
.k-down { background: var(--down-soft); } .k-down .tag { color: var(--down); }
.k-new { background: var(--surface-2); } .k-new .tag { color: var(--muted); }
.tag { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.plates { display: flex; align-items: center; gap: 2px; min-height: 46px; flex-wrap: wrap; }
.bar-end { width: 26px; height: 8px; background: var(--p125); border-radius: 2px; margin-right: 2px; }
.plate { width: 9px; border-radius: 2px; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); box-sizing: border-box; }
.plates-txt { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: 10px; }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 26px minmax(0,1fr) minmax(0,1fr) 52px; gap: 6px; align-items: center; }
.set.head { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.set .n { font-family: var(--mono); color: var(--muted); text-align: center; }
.set input, .set select { min-width: 0; width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; height: 44px; padding: 0 8px; text-align: center; font-family: var(--mono); font-size: 16px; }
.set select { padding: 0 2px; }
.ok { height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; font-weight: 700; color: var(--muted); }
.set.done input, .set.done select { background: var(--up-soft); border-color: transparent; }
.set.done .ok { background: var(--up); border-color: var(--up); color: var(--surface); }
.hint { font-size: 14px; color: var(--muted); border-left: 3px solid var(--hold); padding-left: 10px; }
.next { display: grid; gap: 8px; }
.next button { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px dashed var(--muted); border-radius: var(--r); padding: 10px 14px; min-height: 52px; }
.next button:hover { border-style: solid; border-color: var(--ink); }
.next b { font-weight: 600; } .next small { color: var(--muted); display: block; font-size: 13px; }
.next .plus { font-family: var(--display); font-size: 26px; color: var(--accent); flex: none; }
.picker { display: grid; gap: 10px; }
.exlist { max-height: 340px; overflow-y: auto; display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: var(--surface-2); }
.exlist h4 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: var(--body); font-weight: 600; padding: 8px 6px 4px; }
.exlist button { text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 9px 8px; display: flex; justify-content: space-between; gap: 10px; }
.exlist button:hover { background: var(--surface); }
.exlist button span { color: var(--muted); font-size: 13px; }

/* Rest timer */
.rest { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 8;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rest-in { max-width: 680px; margin: 0 auto 8px; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 8px; position: relative; overflow: hidden; }
.rest-in .t { font-family: var(--mono); font-size: 24px; font-weight: 600; flex: 1; }
.rest-in .t small { font-family: var(--body); font-size: 13px; opacity: .7; margin-left: 6px; }
.rest-in button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); color: var(--bg); border-radius: 6px; min-height: 38px; padding: 0 10px; font-weight: 600; }
.rest-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { background: transparent; border: 0; height: 64px; display: grid; place-items: center; gap: 0; align-content: center; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }

/* History */
.hist { display: grid; gap: 10px; }
.hcard summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; }
.hcard summary::-webkit-details-marker { display: none; }
.hdate { text-align: center; border-right: 1px solid var(--line); padding-right: 10px; }
.hdate b { display: block; font-family: var(--display); font-size: 30px; line-height: 1; }
.hdate span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hcard h3 { font-size: 22px; text-transform: uppercase; }
.hcard .stat { text-align: right; font-size: 13px; color: var(--muted); }
.hcard .stat b { display: block; font-family: var(--mono); font-size: 15px; color: var(--ink); }
.hlines { display: grid; gap: 6px; padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); }
.hlines div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.hlines .num { color: var(--muted); text-align: right; }

/* Progress */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stat-t { background: var(--surface-2); border-radius: 8px; padding: 10px; display: grid; gap: 2px; }
.stat-t b { font-family: var(--mono); font-size: 18px; }
.stat-t span { font-size: 12px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.vol { display: grid; gap: 8px; }
.vrow { display: grid; grid-template-columns: 92px minmax(0,1fr) 34px; gap: 10px; align-items: center; font-size: 14px; }
.vtrack { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.vzone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--up) 18%, transparent); }
.vfill { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 2px; background: var(--ink); }
.vfill.low { background: var(--down); } .vfill.good { background: var(--up); } .vfill.high { background: var(--accent); }
.prs { display: grid; gap: 0; }
.prs div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.prs div:last-child { border-bottom: 0; }

/* Coach */
.chat { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.msg.user { justify-self: end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 4px; }
.msg.assistant { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.error { border-color: var(--down); }
.msg p + p, .msg ul + p, .msg p + ul { margin-top: 8px; }
.msg ul { margin: 6px 0 0; padding-left: 20px; }
.msg h4 { font-size: 18px; margin-top: 8px; }
.coach-form { display: flex; gap: 8px; align-items: flex-end; }
.coach-form textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 48px; max-height: 140px; }
.quick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.quick button { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
.quick button:hover { border-color: var(--ink); }
.coach-badge { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; flex: none; }

/* Sheet + toast */
.sheet { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; align-items: end; justify-items: center;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.sheet-in { background: var(--surface); border-radius: 14px; padding: 18px; width: 100%; max-width: 460px; display: grid; gap: 14px; box-sizing: border-box; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); box-sizing: border-box; }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 8px; justify-items: center; }
.empty svg { width: 120px; height: auto; color: var(--muted); }
.spark { width: 100%; height: 60px; display: block; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 380px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } .hero h2 { font-size: 36px; } }
</style>

/* ---------- Storage: private per-user db, else this device ---------- */
const LKEY = 'carnet.data.v1';
const Store = {
  col: null, local: false, q: {},
  async init() {

    this.col = db.collection('data/users/' + id);

function applySnapshot(snap, first) {
  const sessions = []; let profile = null, active = null;
  snap.docs.forEach(d => {
    const v = d.data(); if (!v) return;
    if (v.kind === 'session') sessions.push({ ...v, id: d.id });
    else if (d.id === 'profile') profile = v;
    else if (d.id === 'active') active = v;
  });
  S.sessions = sessions.sort((a, b) => a.date < b.date ? -1 : 1);
  if (profile) S.profile = { ...defaultProfile(), ...profile };
  if (first && active && Array.isArray(active.exercises)) S.active = active;
}

/* ---------- Training logic ---------- */
const allEx = () => [...LIB, ...(S.profile.custom || [])];
const exInfo = id => LIBMAP[id] || (S.profile.custom || []).find(e => e.id === id) || { id, name: id, muscle: 'autre', group: 'full', kind: 'machine', c: 0 };
function step(e) {
  if (e.kind === 'dumbbell') return 2;
  if ((e.kind === 'barbell' || e.kind === 'machine') && e.group === 'legs' && e.c) return 5;
  return 2.5;
}
const roundTo = (w, s) => Math.max(0, Math.round(w / s) * s);
function repTarget() { const g = S.profile.goal; return g === 'force' ? 6 : g === 'endurance' ? 15 : 10; }
function repRange() { const t = repTarget(); return [t, t]; }
const doneSets = x => (x.sets || []).filter(s => s.done && num(s.r) > 0).map(s => ({ w: num(s.w), r: num(s.r) }));
function history(exId) {
  const out = [];
  for (const s of S.sessions) {
    const x = (s.exercises || []).find(e => e.ex === exId); if (!x) continue;
    const sets = doneSets(x); if (!sets.length) continue;
    out.push({ date: s.date, sets, top: Math.max(...sets.map(t => t.w)), e1rm: Math.max(...sets.map(t => e1rm(t.w, t.r))), vol: sets.reduce((a, t) => a + t.w * t.r, 0) });
  }
  return out;
}
function suggest(exId) {
  // Method: every set close to failure, fixed target T. 10/9/8 is fine; when every set hits T, add load.
  const e = exInfo(exId), T = repTarget(), h = history(exId), inc = step(e);
  if (!h.length) return { w: null, r: T, n: e.c ? 4 : 3, kind: 'new', tag: 'Nouveau',
    why: `Première fois : trouve une charge où tu arrives tout juste à ${T} reps sur la 1re série. L’app ajustera ensuite.` };
  const last = h[h.length - 1], top = last.top, topSets = last.sets.filter(s => s.w === top);
  const n = Math.max(3, Math.min(4, last.sets.length));
  const minR = Math.min(...topSets.map(s => s.r)), reps = topSets.map(s => s.r).join('/');
  if (minR >= T)
    return { w: top + inc, r: T, n, kind: 'up', tag: 'On monte', why: `Dernière fois ${fmt(top)} kg × ${reps} : ${T} reps sur toutes les séries. +${fmt(inc)} kg, vise ${T} sur la 1re série.` };
  const same = h.slice(-3).filter(x => x.top === top);
  const tot = x => x.sets.filter(s => s.w === top).reduce((a, s) => a + s.r, 0);
  if (same.length === 3 && tot(same[2]) <= tot(same[0])) {
    const w = roundTo(top * 0.9, e.kind === 'dumbbell' ? 2 : 2.5);
    return { w, r: T, n, kind: 'down', tag: 'Décharge', why: `3 séances à ${fmt(top)} kg sans gagner de reps (${reps}). On baisse de 10 % une séance pour relancer la progression.` };
  }
  return { w: top, r: T, n, kind: 'hold', tag: 'Même charge', why: `Dernière fois ${fmt(top)} kg × ${reps}. Vise ${T} sur chaque série : dès que tu fais ${topSets.length} × ${T}, l’app monte la charge.` };
}
function adjustNext(x, i) {
  const e = exInfo(x.ex), s = x.sets[i], nx = x.sets[i + 1];
  const w = num(s.w), r = num(s.r), T = num(x.target?.r) || repTarget();
  let nw = w, msg;
  if (r >= T + 2) { nw = w + step(e); msg = `${r} reps : tu en avais en réserve. ${fmt(nw)} kg pour les séries suivantes, vise ${T} pile.`; }
  else if (r <= T - 4) { nw = roundTo(w * 0.93, e.kind === 'dumbbell' ? 2 : 2.5); msg = `Seulement ${r} reps : baisse à ${fmt(nw)} kg pour les séries suivantes.`; }
  else if (r >= T) msg = `${r} reps : parfait. Garde ${fmt(w)} kg.`;
  else msg = `${r} reps : normal de perdre des reps à l’échec. Garde ${fmt(w)} kg.`;
  if (!nx) {
    const ds = doneSets(x), topW = Math.max(...ds.map(d => d.w)), atTop = ds.filter(d => d.w === topW);
    msg = atTop.length && atTop.every(d => d.r >= T) ? `${atTop.length} × ${T} validés à ${fmt(topW)} kg : la prochaine fois, l’app monte la charge.` : `Exercice terminé. La prochaine fois : même charge, vise ${T} sur chaque série.`;
  }
  x.hint = msg;
  x.sets.slice(i + 1).forEach(n => { if (!n.done && !n.edited) n.w = nw; });
}
function weeklySets(days = 7, includeActive = true) {
  const out = {}; const lim = Date.now() - days * 86400000;
  const add = s => (s.exercises || []).forEach(x => { const m = exInfo(x.ex).muscle; out[m] = (out[m] || 0) + doneSets(x).length; });
  S.sessions.filter(s => new Date(s.date).getTime() >= lim).forEach(add);
  if (includeActive && S.active) add(S.active);
  return out;
}
function sessionGroup(s) {
  const c = {}; (s.exercises || []).forEach(x => { const g = exInfo(x.ex).group; if (g !== 'core') c[g] = (c[g] || 0) + 1; });
  const ks = Object.keys(c); if (!ks.length) return s.group || 'full';
  if (ks.length >= 3) return 'full';
  return ks.sort((a, b) => c[b] - c[a])[0];
}
function recommendGroup() {
  const lastBy = { push: null, pull: null, legs: null };
  S.sessions.forEach(s => { const g = sessionGroup(s); const gs = g === 'full' ? ['push', 'pull', 'legs'] : [g]; gs.forEach(k => { if (k in lastBy) lastBy[k] = s.date; }); });
  let best = 'push', bd = -1;
  for (const g of ['legs', 'push', 'pull']) { const d = lastBy[g] ? dayDiff(lastBy[g]) : 999; if (d > bd) { bd = d; best = g; } }

  return { g: best, days: bd === 999 ? null : bd };
}
function templateFor(g) {
  const base = TEMPLATES[g].ex;
  if (TEMPLATES[g].mine) return [...base];
  const freq = {};
  S.sessions.slice(-12).forEach(s => (s.exercises || []).forEach(x => { if (exInfo(x.ex).group === g) freq[x.ex] = (freq[x.ex] || 0) + 1; }));
  const fav = g === 'full' ? [] : Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 4);
  const out = [...fav]; for (const id of base) { if (out.length >= 5) break; if (!out.includes(id)) out.push(id); }

}
function nextSuggestions() {
  const a = S.active; if (!a) return [];
  const used = new Set(a.exercises.map(x => x.ex));
  const hit = {}; a.exercises.forEach(x => { const m = exInfo(x.ex).muscle; hit[m] = (hit[m] || 0) + 1; });
  const g = a.exercises.length ? sessionGroup(a) : (a.group || 'full');
  const week = weeklySets(7, false);
  return allEx().filter(e => !used.has(e.id)).map(e => {
    let sc = 0;
    if (g === 'full' || e.group === g) sc += 3; else if (e.group === 'core') sc += 0.5; else sc -= 2;
    sc += hit[e.muscle] ? -0.9 * hit[e.muscle] : 2;
    sc += Math.max(0, 10 - (week[e.muscle] || 0)) / 4;
    if (a.exercises.length < 2 && e.c) sc += 2;
    if (a.exercises.length >= 3 && !e.c) sc += 1;
    const fam = history(e.id).length; if (fam) sc += Math.min(1.5, fam * 0.3);
    const ws = week[e.muscle] || 0;
    const why = !hit[e.muscle] ? `${e.muscle} pas encore travaillés aujourd’hui` + (ws < 10 ? ` · ${ws} séries cette semaine` : '') : `complète ton travail ${e.muscle}`;
    return { e, sc, why };
  }).sort((x, y) => y.sc - x.sc).slice(0, 3);
}

/* ---------- Workout actions ---------- */
function makeEx(id, plan) {
  const sg = suggest(id);
  const t = plan ? { w: plan.weight ?? sg.w, r: plan.reps || sg.r, n: plan.sets || sg.n } : { w: sg.w, r: sg.r, n: sg.n };
  const sets = Array.from({ length: Math.max(1, Math.min(8, t.n)) }, () => ({ w: t.w ?? '', r: t.r, done: false }));
  return { ex: id, target: t, kind: sg.kind, tag: plan ? 'Plan du coach' : sg.tag, why: plan?.note ? `${plan.note} · ${sg.why}` : sg.why, sets };
}
function startWorkout(name, ids, group, plans) {
  S.active = { id: 's' + uid(), name, group, startedAt: Date.now(), date: new Date().toISOString(), exercises: ids.map((id, i) => makeEx(id, plans?.[i])) };
  S.ui.summary = null; S.ui.picker = false;
  Store.saveActive(true); go('seance'); window.scrollTo(0, 0);
}
function finishWorkout() {
  const a = S.active; if (!a) return;
  const exs = a.exercises.map(x => ({ ex: x.ex, sets: doneSets(x).map(s => ({ ...s, done: true })) })).filter(x => x.sets.length);
  if (!exs.length) return toast('Valide au moins une série (bouton ✓) avant de terminer.');
  const prs = [];
  exs.forEach(x => {
    const before = history(x.ex); const best = Math.max(...x.sets.map(s => e1rm(s.w, s.r)));
    const prevBest = before.length ? Math.max(...before.map(h => h.e1rm)) : 0;
    if (before.length && best > prevBest + 0.01) prs.push({ ex: x.ex, best, prev: prevBest });
  });
  const s = { id: a.id, date: a.date, name: a.name || 'Séance', durationMin: Math.max(1, Math.round((Date.now() - a.startedAt) / 60000)), exercises: exs };
  S.sessions.push(s); S.sessions.sort((x, y) => x.date < y.date ? -1 : 1);
  Store.saveSession(s);
  S.active = null; Store.saveActive(true); stopRest();
  S.ui.summary = { id: s.id, prs };
  render(); window.scrollTo(0, 0);
}

  S.rest = { end: Date.now() + sec * 1000, total: sec, label: e.name }; tickRest();
}
function stopRest() { S.rest = null; tickRest(); }
function tickRest() {

function lineChart(h) {

  const X = i => L + (h.length === 1 ? 0 : i * (W - L - R) / (h.length - 1)), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

  const ticks = [lo, (lo + hi) / 2, hi];

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du 1RM estimé et de la charge max">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${Math.round(v)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity=".1"/>
    <path d="${path(ts)}" fill="none" stroke="var(--hold)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="${path(ys)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${ys.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === ys.length - 1 ? 4.5 : 2.5}" fill="var(--accent)"/>`).join('')}
    <text x="${L}" y="${H - 8}">${d(h[0].date)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end">${d(h[h.length - 1].date)}</text>
    <text x="${X(ys.length - 1) - 6}" y="${Y(ys[ys.length - 1]) - 8}" text-anchor="end" style="fill:var(--accent);font-weight:600">${Math.round(ys[ys.length - 1])} kg</text>
  </svg><div class="row small muted"><span><span style="color:var(--accent)">━</span> 1RM estimé</span><span><span style="color:var(--hold)">┅</span> charge max</span></div>`;
}

  <section class="card"><span class="eyebrow">Données</span>
    <p class="small muted">${S.mode === 'cloud' ? 'Ton carnet est enregistré dans ton compte Claude, visible par toi seul, sur tous tes appareils.' : 'Ton carnet est enregistré dans ce navigateur, sur cet appareil uniquement.'} ${S.sessions.length} séance${S.sessions.length > 1 ? 's' : ''}.</p>
    <div class="row"><button class="btn ghost small" data-act="wipe">Effacer tout le carnet</button></div>
  </section>`;
}
function spark(vals) {
  const W = 300, H = 60, lo = Math.min(...vals) - 0.5, hi = Math.max(...vals) + 0.5;
  const pts = vals.map((v, i) => `${(i * (W - 8) / (vals.length - 1) + 4).toFixed(1)},${(4 + (1 - (v - lo) / (hi - lo)) * (H - 8)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--hold)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function md(t) {
  const inl = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  let html = '', list = false;
  for (const l of esc(t).split('\n')) {
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inl(m[1])}</li>`; continue; }
    if (list) { html += '</ul>'; list = false; }
    if (/^#{1,4}\s/.test(l)) html += `<h4>${inl(l.replace(/^#+\s/, ''))}</h4>`;
    else if (l.trim()) html += `<p>${inl(l)}</p>`;
  }
  return html + (list ? '</ul>' : '');
}

/* ---------- Render ---------- */
function render() {
  const sync = $('#sync');
  sync.className = 'sync ' + S.mode;
  sync.lastElementChild.textContent = S.mode === 'cloud' ? 'Synchronisé' : S.mode === 'local' ? 'Sur cet appareil' : 'Chargement…';
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  const v = { seance: () => S.ui.summary ? vSummary() : S.active ? vActive() : vStart(), historique: vHistory, progres: vProgress, coach: vCoach, profil: vProfile }[S.tab] || vStart;
  $('#main').innerHTML = v();
  if (S.tab === 'coach') { const c = $('#chat'); if (c && S.chat.length) c.lastElementChild?.scrollIntoView({ block: 'nearest' }); }
}
let deferred = false;
function renderSafe() {
  const f = document.activeElement;
  if (f && f.closest && f.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(f.tagName)) { deferred = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (deferred) { deferred = false; renderSafe(); } }, 50));
function go(tab) { S.tab = tab; lsSet('carnet.tab', tab); render(); }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
let confirmFn = null;
function ask(msg, ok, fn) {
  confirmFn = fn; const s = $('#sheet');
  s.innerHTML = `<div class="sheet-in" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button class="btn primary" data-act="confirm">${esc(ok)}</button><button class="btn" data-act="cancel">Annuler</button></div></div>`;
  s.hidden = false; $('[data-act=confirm]', s).focus();
}

/* ---------- Coach IA ---------- */
function coachContext() {
  const p = S.profile, week = weeklySets(7);
  const sess = [...S.sessions].reverse().slice(0, 10).map(s => `- ${s.date.slice(0, 10)} « ${s.name} » (${s.durationMin || '?'} min) : ` + s.exercises.map(x => `${exInfo(x.ex).name} ${doneSets(x).map(t => `${fmt(t.w)}×${t.r}`).join(', ')}`).join(' | ')).join('\n') || '(aucune séance enregistrée)';
  const ids = [...new Set(S.sessions.flatMap(s => s.exercises.map(x => x.ex)))];
  const recs = ids.map(id => { const h = history(id); return `- ${exInfo(id).name} : 1RM est. ${Math.round(Math.max(...h.map(x => x.e1rm)))} kg, ${h.length} séances, conseil app → ${(() => { const s = suggest(id); return s.w != null ? `${s.n}×${s.r} à ${fmt(s.w)} kg (${s.tag})` : 'à calibrer'; })()}`; }).join('\n') || '(aucun)';
  const act = S.active ? `Séance en cours « ${S.active.name} » : ` + S.active.exercises.map(x => `${exInfo(x.ex).name} [${x.sets.map(s => `${s.w || '?'}×${s.r || '?'}${s.done ? '✓' : ''}`).join(', ')}]`).join(' | ') : 'Aucune séance en cours.';
  const bw = (p.bodyweight || []).slice(-4).map(b => `${b.d.slice(0, 10)}: ${b.kg} kg`).join(', ') || 'non renseigné';
  return `Tu es le coach de musculation intégré à l’appli « Carnet de Fonte ». Tu parles français, tu tutoies, ton ton est direct, motivant et précis. Tu t’appuies sur les données ci-dessous (charges en kg, reps) et tu donnes des chiffres concrets : charges, séries, reps, repos. Principes : surcharge progressive, 10 à 20 séries par muscle et par semaine, technique avant la charge, décharge en cas de stagnation. Réponses courtes (moins de 180 mots) sauf si on te demande un programme. Utilise des listes à puces et du **gras** pour les chiffres clés. Si l’athlète parle de douleur ou de blessure, conseille d’arrêter l’exercice concerné et de consulter un professionnel de santé.

PROFIL : ${p.name || 'athlète'} · objectif ${GOALS[p.goal] || p.goal} · MÉTHODE DE L’ATHLÈTE (à respecter) : chaque série proche de l’échec, objectif ${repTarget()} reps, 3 à 4 séries ; une baisse du type ${repTarget()}/${repTarget()-1}/${repTarget()-2} est normale ; il augmente la charge dès qu’il fait ${repTarget()} reps sur toutes ses séries. Il n’utilise pas le RPE, n’en parle pas · poids de corps : ${bw} · date du jour : ${new Date().toISOString().slice(0, 10)}
SÉRIES PAR MUSCLE (7 derniers jours) : ${MUSCLES.map(m => `${m} ${week[m] || 0}`).join(', ')}
DERNIÈRES SÉANCES (plus récente d’abord ; format charge×reps) :
${sess}
PAR EXERCICE :
${recs}
${act}`;
}
async function askCoach(text) {
  if (!S.sample || S.ui.busy || !text.trim()) return;
  if (S.tab !== 'coach') S.tab = 'coach', lsSet('carnet.tab', 'coach');
  S.chat.push({ role: 'user', content: text.trim() });
  const pend = { role: 'assistant', content: '', pending: true }; S.chat.push(pend);
  S.ui.busy = true; render();
  let msgs = S.chat.filter(m => m !== pend && !m.error && m.content).slice(-12).map(m => ({ role: m.role, content: m.content }));
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  msgs[0] = { role: 'user', content: coachContext() + '\n\n---\nMessage de l’athlète :\n' + msgs[0].content };
  try {
    const r = await S.sample(msgs, { cache: false, onText: ({ text: t }) => { pend.content = t; const el = $('#pending'); if (el) el.innerHTML = md(t); } });
    pend.content = r.text || pend.content;
  } catch (err) {
    pend.error = true;
    pend.content = err?.code === 'not_granted' ? 'Le coach n’a pas l’autorisation de répondre. Autorise « Demander à Claude » dans les permissions de l’appli.' : err?.code === 'rate_limited' ? 'Trop de messages d’un coup. Réessaie dans une minute.' : 'Le coach n’a pas pu répondre (' + (err?.message || err?.code || 'erreur') + ').';
    if (err?.code === 'not_granted') S.sample = null;
  }
  pend.pending = false; S.ui.busy = false;
  lsSet('carnet.chat', S.chat.filter(m => !m.error).slice(-40));
  render();
}
function matchEx(name, muscle) {
  const n = norm(name); if (!n) return null;
  let e = allEx().find(x => norm(x.name) === n) || allEx().find(x => norm(x.name).includes(n) || n.includes(norm(x.name)));
  if (e) return e.id;
  const m = MUSCLES.find(mm => norm(mm) === norm(muscle || '')) || 'autre';
  const c = { id: 'c-' + n.replace(/ /g, '-').slice(0, 40), name: String(name).slice(0, 60), muscle: m, group: 'full', kind: 'machine', c: 0 };
  S.profile.custom = [...(S.profile.custom || []).filter(x => x.id !== c.id), c]; Store.saveProfile();
  return c.id;
}
async function generateWorkout() {
  if (!S.sample || S.ui.busy) return;
  S.ui.busy = true; toast('Le coach prépare ta séance…');
  try {
    const plan = await S.sample.json(coachContext() + `

TÂCHE : conçois la prochaine séance idéale pour cet athlète (groupe musculaire le plus reposé, volume hebdo manquant, charges basées sur son historique et les conseils de l’app). Réponds UNIQUEMENT avec un objet JSON de cette forme :
{"name": "nom court de la séance", "why": "une phrase qui justifie le choix", "exercises": [{"name": "nom de l’exercice", "muscle": "muscle principal", "sets": 3, "reps": 8, "weight": 80, "note": "consigne courte"}]}
Règles : 4 à 7 exercices, polyarticulaires d’abord. "weight" en kg, ou null si l’athlète n’a pas d’historique sur cet exercice. Utilise de préférence ces noms exacts : ${allEx().map(e => e.name).join(', ')}. Muscles possibles : ${MUSCLES.join(', ')}.`, { modelTier: 'default' });
    const exs = (plan?.exercises || []).filter(x => x && x.name).slice(0, 8);
    if (!exs.length) throw { message: 'séance vide' };
    const ids = [], plans = [];
    exs.forEach(x => { const id = matchEx(x.name, x.muscle); if (id && !ids.includes(id)) { ids.push(id); plans.push({ sets: Math.round(num(x.sets)) || 3, reps: Math.round(num(x.reps)) || 8, weight: x.weight == null || x.weight === '' ? null : num(x.weight), note: x.note ? String(x.note).slice(0, 140) : '' }); } });
    S.ui.busy = false;
    startWorkout(String(plan.name || 'Séance du coach').slice(0, 40), ids, 'full', plans);
    if (plan.why) toast(String(plan.why).slice(0, 160));
  } catch (err) {
    S.ui.busy = false;
    if (err?.code === 'not_granted') { S.sample = null; render(); }
    toast('Le coach n’a pas pu générer la séance : ' + (err?.message || err?.code || 'erreur'));
  }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, xi = +b.dataset.x, si = +b.dataset.s, a = S.active;
  switch (act) {
    case 'tab': go(b.dataset.tab); window.scrollTo(0, 0); break;
    case 'start': { const g = b.dataset.g; startWorkout(TEMPLATES[g].name, templateFor(g), g); break; }
    case 'free': startWorkout('Séance libre', [], 'full'); S.ui.picker = true; render(); break;
    case 'gen': generateWorkout(); break;
    case 'finish': finishWorkout(); break;
    case 'abort': ask('Abandonner cette séance ? Les séries non enregistrées seront perdues.', 'Abandonner', () => { S.active = null; Store.saveActive(true); stopRest(); render(); }); break;
    case 'done': {
      const x = a.exercises[xi], s = x.sets[si];
      if (!s.done && !(num(s.r) > 0)) { toast('Indique le nombre de reps avant de valider.'); break; }
      s.done = !s.done;
      if (s.done) { s.w = num(s.w); s.r = num(s.r); adjustNext(x, si); startRest(x); }
      Store.saveActive(); render();
      if (s.done) { const nx = $(`#r-${xi}-${si + 1}`); if (nx) nx.closest('.set').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      break;
    }
    case 'addset': { const x = a.exercises[xi], l = x.sets[x.sets.length - 1] || {}; x.sets.push({ w: l.w ?? '', r: x.target?.r || l.r || '', done: false }); Store.saveActive(); render(); break; }
    case 'rmset': { const x = a.exercises[xi]; if (x.sets.length > 1) x.sets.pop(); Store.saveActive(); render(); break; }
    case 'rmex': a.exercises.splice(xi, 1); Store.saveActive(); render(); break;
    case 'addex': a.exercises.push(makeEx(b.dataset.id)); S.ui.picker = false; S.ui.q = ''; Store.saveActive(); render(); $(`#ex-${a.exercises.length - 1}`)?.scrollIntoView({ block: 'start', behavior: 'smooth' }); break;
    case 'picker': S.ui.picker = true; render(); $('#exq')?.focus(); break;
    case 'custom': { const name = S.ui.q.trim(); if (!name) break; const id = matchEx(name, ''); a.exercises.push(makeEx(id)); S.ui.picker = false; S.ui.q = ''; Store.saveActive(); render(); break; }
    case 'rest': if (S.rest) { S.rest.end += num(b.dataset.d) * 1000; S.rest.total = Math.max(S.rest.total, Math.ceil((S.rest.end - Date.now()) / 1000)); tickRest(); } break;
    case 'reststop': stopRest(); break;
    case 'closesum': S.ui.summary = null; render(); break;
    case 'debrief': S.ui.summary = null; askCoach('Je viens de terminer ma séance. Fais-moi un débrief : ce qui était bien, ce qu’il faut ajuster, et les charges pour la prochaine fois.'); break;
    case 'delsess': { const id = b.dataset.id; ask('Supprimer cette séance de l’historique ?', 'Supprimer', () => { S.sessions = S.sessions.filter(s => s.id !== id); Store.deleteSession(id); render(); }); break; }
    case 'ask': askCoach(b.dataset.q); break;
    case 'clearchat': S.chat = []; lsSet('carnet.chat', []); render(); break;
    case 'addbw': { const v = num($('#bw-in').value); if (v < 20 || v > 400) { toast('Entre un poids en kg, par exemple 78,4.'); break; } S.profile.bodyweight = [...(S.profile.bodyweight || []), { d: new Date().toISOString(), kg: v }].slice(-120); Store.saveProfile(); render(); break; }
    case 'wipe': ask('Effacer toutes tes séances, ton profil et la séance en cours ? C’est définitif.', 'Tout effacer', () => { S.sessions.forEach(s => Store.deleteSession(s.id)); S.sessions = []; S.active = null; S.profile = defaultProfile(); Store.saveActive(true); Store.saveProfile(); render(); }); break;
    case 'confirm': { const fn = confirmFn; confirmFn = null; $('#sheet').hidden = true; fn && fn(); break; }
    case 'cancel': confirmFn = null; $('#sheet').hidden = true; break;
  }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') { confirmFn = null; e.currentTarget.hidden = true; } });
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset?.f; if (!f) return;
  const a = S.active;
  if ((f === 'w' || f === 'r') && a) { const s = a.exercises[+t.dataset.x].sets[+t.dataset.s]; s[f] = t.value; if (f === 'w') s.edited = true; Store.saveActive(); }
  else if (f === 'aname' && a) { a.name = t.value; Store.saveActive(); }
  else if (f === 'q') { S.ui.q = t.value; const l = $('#exlist'); if (l) l.innerHTML = pickerList(); }
  else if (f === 'pname') { S.profile.name = t.value.slice(0, 40); clearTimeout(window._pt); window._pt = setTimeout(() => Store.saveProfile(), 600); }
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset?.f; if (!f) return;
  const a = S.active;
  if (f === 'progEx') { S.ui.progEx = t.value; render(); }
  else if (f === 'goal') { S.profile.goal = t.value; Store.saveProfile(); render(); }
  else if (f === 'bar') { S.profile.bar = num(t.value); Store.saveProfile(); render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'coachForm') return; e.preventDefault();
  const i = $('#coachIn'); const v = i.value; i.value = ''; askCoach(v);
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'coachIn' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#coachForm').requestSubmit(); }
  if (e.key === 'Escape' && !$('#sheet').hidden) { confirmFn = null; $('#sheet').hidden = true; }
});

/* ---------- Boot ---------- */
render();
Store.init().then(() => { render(); if (S.active) toast('Séance en cours reprise.'); });
</script>
