<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2b33d">
<meta name="description" content="Miel & Dards : dirige ta ruche, plante des fleurs et défends la Reine contre un Frelon chef qui apprend tes faiblesses.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Miel & Dards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="row">
      <span class="chip" id="honey">🍯 0</span>
      <span class="chip" id="pollen">🌼 0</span>
      <span class="chip" id="bees">🐝 0</span>
      <span class="chip" id="hp">❤️ 0</span>
      <span class="grow"></span>
      <button class="sq" id="btnSpeed" aria-label="Vitesse">x1</button>
      <button class="sq" id="btnPause" aria-label="Pause">⏸</button>
      <button class="sq" id="btnMenu" aria-label="Réglages">⚙️</button>
    </div>
    <div class="row wave">
      <span id="waveLabel">Calme</span>
      <div class="bar"><i id="waveBar"></i></div>
      <span id="waveInfo"></span>
      <button id="btnWave">⚔️ Vague</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="bubble" hidden></div>
    <div id="toasts"></div>
  </main>

  <footer id="dock">
    <div id="tools"></div>
    <nav id="tabs">
      <button data-tab="flowers" class="on">🌸<span>Fleurs</span></button>
      <button data-tab="defense">🛡️<span>Défenses</span></button>
      <button data-tab="colony">🐝<span>Colonie</span></button>
    </nav>
  </footer>

  <div id="modal" hidden>
    <div class="sheet">
      <header><h2 id="modalTitle"></h2><button class="sq" id="modalClose" aria-label="Fermer">✕</button></header>
      <div id="modalBody"></div>
    </div>
  </div>

  <section id="menu">
    <canvas id="menuBees" aria-hidden="true"></canvas>
    <div class="brand">
      <div class="comb">🍯</div>
      <h1>Miel <span>&amp;</span> Dards</h1>
      <p>Fais fleurir la prairie, élève ta colonie<br>et protège ta Reine d'un Frelon chef <b>qui apprend</b>.</p>
    </div>
    <div class="menu-btns">
      <button class="cta" id="btnContinue" hidden>▶ Continuer</button>
      <button class="cta" id="btnNew">🐝 Nouvelle ruche</button>
      <button class="soft" id="btnHow">📖 Comment jouer</button>
      <button class="soft" id="btnSettings">⚙️ Réglages</button>
    </div>
    <p id="best"></p>
  </section>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
