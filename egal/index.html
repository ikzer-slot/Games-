<title>Égal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : une colonne de téléphone, des "tickets de temps" perforés comme unité visuelle, une barre d'onglets en bas. */
:root {
  --paper: #eef1ec;
  --surface: #fbfcfa;
  --ink: #15211b;
  --muted: #5d6b63;
  --line: #d5dcd6;
  --accent: #2443d6;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fb;
  --earn: #17824f;
  --spend: #b4441b;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1311; --surface: #151d19; --ink: #e6eee9; --muted: #95a39b; --line: #26322c;
    --accent: #8fa3ff; --accent-ink: #0d1311; --accent-soft: #1d2440; --earn: #4cc98d; --spend: #f08a5d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1311; --surface: #151d19; --ink: #e6eee9; --muted: #95a39b; --line: #26322c;
  --accent: #8fa3ff; --accent-ink: #0d1311; --accent-soft: #1d2440; --earn: #4cc98d; --spend: #f08a5d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 520px; margin: 0 auto;
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.02em; }
h1 { font-size: 34px; line-height: 1.05; font-weight: 800; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; line-height: 1.25; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.label { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* En-tête */
.top { display: flex; align-items: center; gap: 12px; }
.brand { font: 800 26px/1 var(--display); letter-spacing: -.03em; }
.brand b { color: var(--accent); }
.top .spacer { flex: 1; }
.me-chip { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font: 700 14px var(--mono); }
.me-chip img { width: 26px; height: 26px; border-radius: 50%; }
.notice { padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 14px; }

/* Manifeste */
.manifesto { display: flex; flex-direction: column; gap: 8px; }
.manifesto h1 em { font-style: normal; color: var(--accent); }

/* Filtres */
.seg { display: flex; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* Ticket de temps */
.list { display: flex; flex-direction: column; gap: 12px; }
.ticket {
  display: grid; grid-template-columns: 78px 1fr; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  animation: rise .3s ease both;
}
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
.stub {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 14px 4px; border-right: 2px dashed var(--line);
}
.stub::before, .stub::after { content: ""; position: absolute; right: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); }
.stub::before { top: -9px; } .stub::after { bottom: -9px; }
.stub .min { font: 700 26px/1 var(--mono); letter-spacing: -.04em; }
.stub .unit { font: 500 11px var(--mono); color: var(--muted); }
.ticket.offre .stub .min { color: var(--earn); }
.ticket.demande .stub .min { color: var(--accent); }
.body { padding: 14px 14px 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.kind { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kind .k { font: 700 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; }
.offre .kind .k { background: color-mix(in srgb, var(--earn) 14%, transparent); color: var(--earn); }
.demande .kind .k { background: var(--accent-soft); color: var(--accent); }
.kind .cat { font-size: 13px; color: var(--muted); }
.desc { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.who img { width: 22px; height: 22px; border-radius: 50%; flex: none; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.ticket.example { border-style: dashed; opacity: .78; }
.ticket.example .ex { font: 700 11px var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.big { width: 100%; padding: 15px; font-size: 17px; border-radius: 14px; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.earn { background: var(--earn); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:active:not(:disabled) { transform: scale(.98); }

/* Solde */
.bank { background: var(--ink); color: var(--paper); border-radius: 22px; padding: 22px 20px; display: flex; flex-direction: column; gap: 6px; }
.bank .label { color: color-mix(in srgb, var(--paper) 65%, transparent); }
.bank .clock { font: 700 64px/1 var(--mono); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.bank .clock small { font-size: 20px; letter-spacing: 0; margin-left: 4px; opacity: .7; }
.bank .split { display: flex; gap: 18px; font: 500 14px var(--mono); margin-top: 6px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.ledger .row { padding: 10px 0; border-top: 1px solid var(--line); }
.ledger .row:first-of-type { border-top: 0; padding-top: 0; }
.amt { font: 700 16px var(--mono); font-variant-numeric: tabular-nums; }
.amt.plus { color: var(--earn); } .amt.minus { color: var(--spend); }
.community { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.community div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; }
.community b { display: block; font: 700 22px var(--mono); }
.community span { font-size: 12px; color: var(--muted); }

/* Formulaire */
form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field label, .field .label { font-weight: 600; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); }
input[type="text"], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 13px; }
textarea { min-height: 90px; resize: vertical; }
.dur { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.dur button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 0; font: 700 14px var(--mono); }
.dur button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Onglets */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; justify-content: center; gap: 6px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tabs a { flex: 1; max-width: 160px; text-align: center; padding: 9px 0; border-radius: 12px; font-weight: 600; font-size: 14px; color: var(--muted); text-decoration: none; }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.tabs a.plus { color: var(--accent-ink); background: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 9; background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 18px 6px 4px; display: flex; flex-direction: column; gap: 6px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">ég<b>a</b>l</div>
    <div class="spacer"></div>
    <div class="me-chip" id="meChip" hidden><img id="meAvatar" alt=""><span id="meBalance">1:00</span></div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Navigation">
  <a href="#autour" data-route="autour">Autour de moi</a>
  <a href="#proposer" data-route="proposer" class="plus">+ Proposer</a>
  <a href="#temps" data-route="temps">Mon temps</a>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  'use strict';
  const WELCOME = 60; // minutes offertes à l'arrivée
  const CATS = ['Bricolage', 'Cuisine', 'Langues', 'Numérique', 'Musique', 'Sport', 'Jardin', 'Cours', 'Compagnie', 'Déménagement', 'Autre'];
  const DURS = [15, 30, 45, 60, 90, 120];
  const EXAMPLES = [
    { kind: 'offre', title: 'Je répare ton vélo (crevaison, freins, chaîne)', desc: 'J\'ai les outils, tu amènes le vélo.', minutes: 30, cat: 'Bricolage' },
    { kind: 'demande', title: 'Quelqu\'un pour m\'aider à installer mon imprimante', desc: 'Elle ne veut pas se connecter au Wi-Fi.', minutes: 20, cat: 'Numérique' },
    { kind: 'offre', title: 'Conversation en espagnol autour d\'un café', desc: 'Je suis natif, tous niveaux bienvenus.', minutes: 45, cat: 'Langues' },
  ];

  const $ = (id) => document.getElementById(id);
  const view = $('view');
  const S = { db: null, user: null, me: null, canWrite: null, offers: [], exchanges: [], loaded: { o: false, e: false }, stale: false,
              filter: 'tout', cat: null, form: { kind: 'offre', minutes: 30, cat: 'Bricolage' } };

  // ---------- utilitaires
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hm = (min) => { const s = min < 0 ? '−' : ''; const a = Math.abs(Math.round(min)); return `${s}${Math.floor(a / 60)}:${String(a % 60).padStart(2, '0')}`; };
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return 'à l\'instant'; if (m < 60) return `il y a ${m} min`; const h = Math.round(m / 60); if (h < 24) return `il y a ${h} h`; return `il y a ${Math.round(h / 24)} j`; };
  let toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
  function note(msg) { const n = $('notice'); n.textContent = msg || ''; n.hidden = !msg; }

  const helperOf = (o) => (o.kind === 'offre' ? o.owner : o.taker);
  const receiverOf = (o) => (o.kind === 'offre' ? o.taker : o.owner);

  function balanceOf(id) {
    let earned = 0, spent = 0;
    for (const x of S.exchanges) { if (x.helper === id) earned += x.minutes; if (x.receiver === id) spent += x.minutes; }
    return { earned, spent, total: WELCOME + earned - spent };
  }

  async function people(ids) {
    const uniq = [...new Set(ids.filter(Boolean))];
    if (!S.user || !uniq.length) return {};
    try { return await S.user.profiles(uniq); } catch { return {}; }
  }
  const nameOf = (ps, id) => (id === S.me ? 'Toi' : (ps[id] && ps[id].name) || 'Un voisin');
  const avatarOf = (ps, id) => (ps[id] && ps[id].avatarUrl) || '';

  // ---------- routage
  const ROUTES = ['autour', 'proposer', 'temps'];
  const route = () => (ROUTES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'autour');
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

  let renderSeq = 0;
  async function render() {
    const r = route();
    document.querySelectorAll('.tabs a').forEach((a) => { if (a.dataset.route === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const seq = ++renderSeq;
    const ids = [...S.offers.flatMap((o) => [o.owner, o.taker]), ...S.exchanges.flatMap((x) => [x.helper, x.receiver])];
    const ps = await people(ids);
    if (seq !== renderSeq) return;
    if (r === 'proposer') { if (!view.querySelector('#offerForm')) renderForm(); }
    else if (r === 'temps') renderTime(ps);
    else renderFeed(ps);
    renderMe();
  }

  function renderMe() {
    if (!S.me) return;
    $('meChip').hidden = false;
    $('meBalance').textContent = hm(balanceOf(S.me).total);
  }

  // ---------- ticket
  function ticketHTML(o, ps, opts = {}) {
    const mine = o.owner === S.me;
    const avatar = opts.example ? '' : avatarOf(ps, o.owner);
    let actions = '';
    if (!opts.example) {
      if (o.status === 'open' && !mine) actions = `<button class="btn ${o.kind === 'demande' ? 'earn' : ''}" data-act="take" data-id="${o.id}">${o.kind === 'demande' ? `J'aide · +${o.minutes} min` : `Je réserve · −${o.minutes} min`}</button>`;
      if (o.status === 'open' && mine) actions = `<span class="small muted">Ton annonce · en attente d'un voisin</span><button class="btn ghost" data-act="remove" data-id="${o.id}">Retirer</button>`;
      if (o.status === 'taken') {
        const rec = receiverOf(o), inv = o.owner === S.me || o.taker === S.me;
        if (rec === S.me) actions += `<button class="btn earn" data-act="done" data-id="${o.id}">C'est fait, je valide</button>`;
        else if (inv) actions += `<span class="small muted">En attente de validation par ${esc(nameOf(ps, rec))}</span>`;
        if (inv) actions += `<button class="btn ghost" data-act="release" data-id="${o.id}">Annuler</button>`;
      }
    }
    return `<article class="ticket ${o.kind}${opts.example ? ' example' : ''}">
      <div class="stub"><span class="min">${o.minutes}</span><span class="unit">min</span></div>
      <div class="body">
        <div class="kind">${opts.example ? '<span class="ex">Exemple</span>' : ''}<span class="k">${o.kind === 'offre' ? 'Propose' : 'Cherche'}</span><span class="cat">${esc(o.cat)}</span></div>
        <h3>${esc(o.title)}</h3>
        ${o.desc ? `<p class="desc">${esc(o.desc)}</p>` : ''}
        ${opts.example ? '' : `<div class="who">${avatar ? `<img src="${esc(avatar)}" alt="">` : ''}<span>${esc(nameOf(ps, o.owner))} · ${ago(o.createdAt)}</span></div>`}
        ${actions ? `<div class="actions">${actions}</div>` : ''}
      </div></article>`;
  }

  // ---------- écran : autour de moi
  function renderFeed(ps) {
    const open = S.offers.filter((o) => o.status === 'open');
    const list = open.filter((o) => (S.filter === 'tout' || o.kind === S.filter) && (!S.cat || o.cat === S.cat));
    const totalMin = S.exchanges.reduce((t, x) => t + x.minutes, 0);
    const neighbours = new Set(S.offers.map((o) => o.owner)).size;
    const loading = S.db && !(S.loaded.o && S.loaded.e);
    let content;
    if (loading) content = `<p class="muted small empty">Chargement des annonces…</p>`;
    else if (list.length) content = list.map((o) => ticketHTML(o, ps)).join('');
    else if (!open.length) content = `<div class="empty"><h2>Aucune annonce pour l'instant</h2>
        <p class="muted small">Publie la première : un savoir-faire à offrir, ou un coup de main dont tu as besoin. Voici à quoi ça ressemble :</p></div>
        ${EXAMPLES.map((e) => ticketHTML(e, ps, { example: true })).join('')}
        <a class="btn big" href="#proposer" style="text-align:center;text-decoration:none">Publier ma première annonce</a>`;
    else content = `<p class="muted small empty">Rien dans ce filtre. Essaie « Tout ».</p>`;

    view.innerHTML = `
      <section class="manifesto" style="margin-bottom:18px">
        <span class="label">Banque de temps entre voisins</span>
        <h1>Une heure de toi vaut <em>une heure</em> de n'importe qui.</h1>
        <p class="muted">Aide quelqu'un, gagne du temps. Dépense-le pour te faire aider. Pas d'argent, pas de prix, pas de hiérarchie entre les métiers.</p>
      </section>
      <div class="community" style="margin-bottom:18px">
        <div><b>${open.length}</b><span>annonces ouvertes</span></div>
        <div><b>${hm(totalMin)}</b><span>heures échangées</span></div>
        <div><b>${neighbours}</b><span>voisins actifs</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
        <div class="seg" role="group" aria-label="Type d'annonce">
          ${[['tout', 'Tout'], ['offre', 'On propose'], ['demande', 'On cherche']].map(([k, l]) => `<button data-filter="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join('')}
        </div>
        <div class="chips" role="group" aria-label="Catégorie">
          <button class="chip" data-cat="" aria-pressed="${!S.cat}">Toutes</button>
          ${CATS.map((c) => `<button class="chip" data-cat="${c}" aria-pressed="${S.cat === c}">${c}</button>`).join('')}
        </div>
      </div>
      <div class="list">${content}</div>`;
  }

  // ---------- écran : proposer
  function renderForm() {
    const f = S.form;
    view.innerHTML = `
      <form id="offerForm" novalidate>
        <div><span class="label">Nouvelle annonce</span><h1 style="margin-top:6px">Qu'est-ce que tu échanges ?</h1></div>
        <div class="seg" role="group" aria-label="Type">
          <button type="button" data-kind="offre" aria-pressed="${f.kind === 'offre'}">Je propose mon aide</button>
          <button type="button" data-kind="demande" aria-pressed="${f.kind === 'demande'}">Je cherche de l'aide</button>
        </div>
        <div class="field"><label for="fTitle" id="titleLabel">${f.kind === 'offre' ? 'Ce que tu sais faire' : 'Ce dont tu as besoin'}</label>
          <input type="text" id="fTitle" maxlength="90" required placeholder="${f.kind === 'offre' ? 'Ex. Je t\'apprends les bases de la guitare' : 'Ex. Monter un meuble IKEA'}"></div>
        <div class="field"><label for="fDesc">Détails <span class="muted" style="font-weight:400">(facultatif)</span></label>
          <textarea id="fDesc" maxlength="400" placeholder="Où, quand, ce qu'il faut prévoir…"></textarea></div>
        <div class="field"><span class="label">Durée estimée</span>
          <div class="dur" role="group" aria-label="Durée">${DURS.map((d) => `<button type="button" data-dur="${d}" aria-pressed="${f.minutes === d}">${d < 60 ? d + '′' : Math.floor(d / 60) + 'h' + (d % 60 || '')}</button>`).join('')}</div></div>
        <div class="field"><label for="fCat">Catégorie</label>
          <select id="fCat">${CATS.map((c) => `<option ${f.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <p class="small muted" id="formHint">${f.kind === 'offre' ? 'Quand un voisin réserve et valide, tu gagnes ce temps.' : 'Quand un voisin t\'aide et que tu valides, ce temps est débité de ton solde.'}</p>
        <button class="btn big" type="submit" id="fSubmit">Publier l'annonce</button>
      </form>`;
    if (!S.db) $('fSubmit').disabled = true;
  }

  // ---------- écran : mon temps
  function renderTime(ps) {
    if (!S.me) { view.innerHTML = `<div class="panel"><h2>Ton temps</h2><p class="muted">Ouvre cette page connecté·e à Claude pour avoir ton solde et échanger avec tes voisins.</p></div>`; return; }
    const b = balanceOf(S.me);
    const active = S.offers.filter((o) => o.status === 'taken' && (o.owner === S.me || o.taker === S.me));
    const mineOpen = S.offers.filter((o) => o.status === 'open' && o.owner === S.me);
    const hist = S.exchanges.filter((x) => x.helper === S.me || x.receiver === S.me);
    view.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px">
        <section class="bank">
          <span class="label">Ton temps en banque</span>
          <div class="clock">${hm(b.total)}<small>h</small></div>
          <div class="split"><span>+${hm(b.earned)} donnés</span><span>−${hm(b.spent)} reçus</span><span>+1:00 de bienvenue</span></div>
        </section>
        ${b.total < 0 ? `<p class="notice">Ton solde est négatif : propose ton aide pour le remonter. Chacun a forcément quelque chose à offrir.</p>` : ''}
        <section class="panel"><h2>En cours</h2>
          ${active.length ? `<div class="list">${active.map((o) => ticketHTML(o, ps)).join('')}</div>` : '<p class="muted small">Aucun échange en cours. Réserve une offre ou réponds à une demande dans « Autour de moi ».</p>'}
        </section>
        ${mineOpen.length ? `<section class="panel"><h2>Tes annonces ouvertes</h2><div class="list">${mineOpen.map((o) => ticketHTML(o, ps)).join('')}</div></section>` : ''}
        <section class="panel ledger"><h2>Historique</h2>
          ${hist.length ? hist.map((x) => { const gave = x.helper === S.me; const other = gave ? x.receiver : x.helper; return `
            <div class="row"><div class="grow"><div style="overflow-wrap:anywhere">${esc(x.title)}</div>
              <div class="small muted">${gave ? 'Tu as aidé' : 'Aidé·e par'} ${esc(nameOf(ps, other))} · ${ago(x.at)}</div></div>
              <span class="amt ${gave ? 'plus' : 'minus'}">${gave ? '+' : '−'}${x.minutes}′</span></div>`; }).join('')
            : '<p class="muted small">Ton premier échange apparaîtra ici.</p>'}
        </section>
      </div>`;
  }

  // ---------- actions
  function requireDb() { if (!S.db || !S.me) { toast('Connecte-toi à Claude pour échanger.'); return false; } return true; }
  function writeFailed(e) {
    if (e && e.code === 'invalid_argument') { S.canWrite = false; toast('Tu peux consulter, mais pas publier sur cette page.'); }
    else if (e && e.code === 'quota_exceeded') toast('La page est pleine : retire d\'anciennes annonces.');
    else toast('Ça n\'a pas marché. Réessaie dans un instant.');
  }
  const findOffer = (id) => S.offers.find((o) => o.id === id);

  async function act(kind, id) {
    if (!requireDb()) return;
    const ref = S.db.collection('offers').doc(id);
    const o = findOffer(id);
    try {
      if (kind === 'take') {
        const lease = await ref.acquire({ holder: S.me, ttlMs: 5000 });
        if (!lease.acquired) return toast('Quelqu\'un est en train de la prendre.');
        const snap = await ref.get();
        const cur = snap.exists ? snap.data() : null;
        if (!cur || cur.status !== 'open') return toast('Trop tard, c\'est déjà pris.');
        await ref.update({ status: 'taken', taker: S.me, takenAt: Date.now() });
        toast(o.kind === 'demande' ? 'Super ! Contacte ton voisin pour vous organiser.' : 'Réservé ! Valide quand c\'est fait.');
        location.hash = '#temps';
      } else if (kind === 'release') {
        await ref.update({ status: 'open', taker: null });
        toast('Échange annulé, l\'annonce est de nouveau visible.');
      } else if (kind === 'remove') {
        await ref.delete();
        toast('Annonce retirée.');
      } else if (kind === 'done') {
        if (!o || receiverOf(o) !== S.me) return;
        await S.db.collection('exchanges').doc(id).set({ offer: id, title: o.title, minutes: o.minutes, helper: helperOf(o), receiver: receiverOf(o), at: Date.now() });
        await ref.update({ status: 'done', doneAt: Date.now() });
        toast(`Merci ! ${o.minutes} min transférées à ton voisin.`);
      }
    } catch (e) { writeFailed(e); }
  }

  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.act) return act(b.dataset.act, b.dataset.id);
    if (b.dataset.filter) { S.filter = b.dataset.filter; return render(); }
    if (b.dataset.cat !== undefined) { S.cat = b.dataset.cat || null; return render(); }
    if (b.dataset.kind) {
      S.form.kind = b.dataset.kind;
      document.querySelectorAll('[data-kind]').forEach((x) => x.setAttribute('aria-pressed', x === b));
      $('titleLabel').textContent = S.form.kind === 'offre' ? 'Ce que tu sais faire' : 'Ce dont tu as besoin';
      $('fTitle').placeholder = S.form.kind === 'offre' ? 'Ex. Je t\'apprends les bases de la guitare' : 'Ex. Monter un meuble IKEA';
      $('formHint').textContent = S.form.kind === 'offre' ? 'Quand un voisin réserve et valide, tu gagnes ce temps.' : 'Quand un voisin t\'aide et que tu valides, ce temps est débité de ton solde.';
      return;
    }
    if (b.dataset.dur) { S.form.minutes = +b.dataset.dur; document.querySelectorAll('[data-dur]').forEach((x) => x.setAttribute('aria-pressed', x === b)); }
  });

  document.addEventListener('submit', async (ev) => {
    if (ev.target.id !== 'offerForm') return;
    ev.preventDefault();
    if (!requireDb()) return;
    const title = $('fTitle').value.trim();
    if (title.length < 4) { $('fTitle').focus(); return toast('Décris en quelques mots ce que tu échanges.'); }
    const btn = $('fSubmit'); btn.disabled = true;
    try {
      await S.db.collection('offers').add({
        kind: S.form.kind, title, desc: $('fDesc').value.trim(), minutes: S.form.minutes,
        cat: $('fCat').value, owner: S.me, status: 'open', taker: null, createdAt: Date.now(),
      });
      toast('Annonce publiée !');
      view.innerHTML = '';
      location.hash = '#autour';
    } catch (e) { writeFailed(e); btn.disabled = false; }
  });

  // ---------- connexion aux données partagées
  async function boot() {
    render();
    const use = window.claude && window.claude.use;
    if (!use) { note('Ouvre cette page dans Claude pour échanger avec tes voisins.'); return; }
    const [db, user] = await Promise.all([use('db').catch(() => null), use('user').catch(() => null)]);
    S.user = user;
    if (user) { S.me = await user.id(); S.canWrite = await user.can('data.write'); const me = await user.me(); $('meAvatar').src = me.avatarUrl; }
    if (!db) { note('Connecte-toi à Claude pour voir les annonces et échanger.'); render(); return; }
    S.db = db;
    if (S.canWrite === false) note('Tu peux consulter les annonces. Pour publier, demande un accès Contributeur à la personne qui a partagé la page.');
    const timer = setTimeout(() => { if (!(S.loaded.o && S.loaded.e)) { note('Les annonces ne sont pas encore joignables. Elles apparaîtront dès que la connexion revient.'); S.loaded.o = S.loaded.e = true; render(); } }, 10000);
    const done = () => { if (S.loaded.o && S.loaded.e) { clearTimeout(timer); if ($('notice').textContent.startsWith('Les annonces')) note(''); } };
    const fail = (e) => { clearTimeout(timer); S.loaded.o = S.loaded.e = true; if (e.code !== 'revoked') note('Impossible de charger les annonces pour le moment.'); render(); };
    db.collection('offers').orderBy('createdAt', 'desc').limit(400).onSnapshot((snap) => {
      S.offers = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((o) => o.status !== 'done');
      if (!snap.metadata.fromCache) S.loaded.o = true; done();
      if (route() !== 'proposer') render(); else renderMe();
    }, fail);
    db.collection('exchanges').orderBy('at', 'desc').limit(800).onSnapshot((snap) => {
      S.exchanges = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) S.loaded.e = true; done();
      if (route() !== 'proposer') render(); else renderMe();
    }, fail);
  }
  boot();
})();
</script>
